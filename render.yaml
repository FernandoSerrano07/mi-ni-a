services:
  - type: web
    name: acuerdate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 solo proceso para que el programador no envíe avisos duplicados
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /salud
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: TIMEZONE
        value: America/El_Salvador
      - key: COOKIE_SECURE
        value: "1"
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
